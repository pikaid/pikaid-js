name: Validate JSR package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run native tests and type validation
        run: |
          npm test
          npm run typecheck:types

      - name: Prepare JSR TypeScript package
        run: node scripts/prepare-jsr.mjs

      - name: Check all JSR publishing rules
        run: npx --yes jsr@0.14.3 publish --dry-run
